name = "travel-lens-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 비밀값은 wrangler secret put 으로 등록 (이 파일에 쓰지 말 것)
#   npx wrangler secret put ANTHROPIC_API_KEY --config worker/wrangler.toml
#   npx wrangler secret put APP_TOKEN --config worker/wrangler.toml
# 로컬 개발용 값은 worker/.dev.vars 에 (git 제외됨)

[vars]
# Pages 도메인을 넣으면 해당 Origin만 CORS 허용 (쉼표 구분). 비우면 전체 허용.
ALLOWED_ORIGINS = ""

# IP당 분당 20회 제한 (Cloudflare Rate Limiting 바인딩)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
